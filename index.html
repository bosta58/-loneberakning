<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Genie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #1f2937;
    }

    .container {
      max-width: 640px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: #1f2937;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #111827;
    }

    .subtitle {
      margin-top: 7px;
      color: #6b7280;
      font-size: 15px;
    }

    /* JEZIK */

    .language-menu {
      width: 100%;
      margin: 10px 0 24px;
    }

    .language-menu select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      font-size: 16px;
      background: #f9fafb;
      color: #111827;
      text-align: center;
    }

    /* GLAVNI MENI */

    .main-menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .menu-button {
      width: 100%;
      min-height: 115px;
      margin-top: 0;
      padding: 12px 6px;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      background: #f9fafb;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      cursor: pointer;
    }

    .menu-symbol {
      font-size: 30px;
      font-weight: bold;
    }

    .menu-text {
      font-size: 13px;
      font-weight: 600;
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }
    /* GENIE LOGO */

.genie-header {
  text-align: center;
  padding: 18px 12px 20px;
}

.genie-logo {
  width: 90px;
  margin: 0 auto 4px;
}

.genie-logo svg {
  width: 100%;
  height: auto;
  display: block;
}

.genie-header h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
}

.genie-header .subtitle {
  margin-top: 4px;
}
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- HEADER -->

  <div class="header genie-header">

  <div class="genie-logo">
 <img src="genie-logo.png.PNG" alt="Genie">
  </div>

  <h1>Genie</h1>

  <div class="subtitle">
    Enkel och professionell löneberäkning
  </div>

</div>


      </div>


      <!-- SPRÅK -->

      <div class="language-menu">

        <select id="languageSelect">

          <option value="sv">🇸🇪 Svenska</option>

          <option value="en">🇬🇧 English</option>

          <option value="sr">🇷🇸 Srpski</option>

        </select>

      </div>


      <!-- HUVUDMENY -->

      <div class="main-menu">

        <!-- TIMLÖN -->

        <button
          type="button"
          class="menu-button"
          onclick="window.location.href='kalendar.html'">

          <span class="menu-symbol">T</span>

          <span class="menu-text">
            Timlön
          </span>

        </button>


        <!-- MÅNADSLÖN -->

      <!-- MÅNADSLÖN -->

<button
  type="button"
  class="menu-button"
  onclick="window.location.href='manadslon.html'">

  <span class="menu-symbol">M</span>

  <span class="menu-text">
    Månadslön
  </span>

</button>


        <!-- KOLLEKTIVAVTAL -->

   <button
  type="button"
  class="menu-button"
  onclick="window.location.href='kalendar.html?mode=procent'">

  <span class="menu-symbol">%</span>

  <span class="menu-text">
    Kollektivavtal
  </span>

</button>

      </div>


      <!-- FOOTER -->

      <div class="footer">
        Genie
      </div>

    </div>

  </div>

</body>
</html>
