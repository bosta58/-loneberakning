<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Genie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #1f2937;
    }

    .container {
      max-width: 640px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: #1f2937;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #111827;
    }

    .subtitle {
      margin-top: 7px;
      color: #6b7280;
      font-size: 15px;
    }

    /* JEZIK */

    .language-menu {
      width: 100%;
      margin: 10px 0 24px;
    }

    .language-menu select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      font-size: 16px;
      background: #f9fafb;
      color: #111827;
      text-align: center;
    }

    /* GLAVNI MENI */

    .main-menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .menu-button {
      width: 100%;
      min-height: 115px;
      margin-top: 0;
      padding: 12px 6px;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      background: #f9fafb;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      cursor: pointer;
    }

    .menu-symbol {
      font-size: 30px;
      font-weight: bold;
    }

    .menu-text {
      font-size: 13px;
      font-weight: 600;
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }
    /* GENIE LOGO */

.genie-header {
  text-align: center;
  padding: 18px 12px 20px;
}

.genie-logo {
  width: 150px;
  margin: 0 auto 4px;
}

.genie-logo svg {
  width: 100%;
  height: auto;
  display: block;
}

.genie-header h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
}

.genie-header .subtitle {
  margin-top: 4px;
}
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- HEADER -->

    <div class="header genie-header">

  <div class="genie-logo" aria-label="Genie">
    <svg viewBox="0 0 220 160" role="img">

      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff1a8"/>
          <stop offset="35%" stop-color="#f5c542"/>
          <stop offset="70%" stop-color="#d89b18"/>
          <stop offset="100%" stop-color="#ffd95a"/>
        </linearGradient>
      </defs>

      <text x="18" y="122"
            font-family="Georgia, serif"
            font-size="125"
            font-weight="700"
            fill="none"
            stroke="url(#gold)"
            stroke-width="7">
        G
      </text>

      <text x="72" y="102"
            font-family="Arial, sans-serif"
            font-size="31"
            font-weight="700"
            fill="url(#gold)">
        enie
      </text>

      <path d="M157 20 L184 8 L173 35 Z"
            fill="url(#gold)"/>

      <path d="M158 21 L174 35"
            stroke="#b88316"
            stroke-width="3"
            stroke-linecap="round"/>

      <path d="M43 65
               C51 56 61 59 64 67
               C70 59 80 63 79 72
               C88 70 92 78 86 84
               C91 91 84 98 76 95"
            fill="none"
            stroke="url(#gold)"
            stroke-width="3"
            stroke-linecap="round"/>

    </svg>
  </div>

  <h1>Genie</h1>

  <div class="subtitle">
    Enkel och professionell löneberäkning
  </div>

</div>

      </div>


      <!-- SPRÅK -->

      <div class="language-menu">

        <select id="languageSelect">

          <option value="sv">🇸🇪 Svenska</option>

          <option value="en">🇬🇧 English</option>

          <option value="sr">🇷🇸 Srpski</option>

        </select>

      </div>


      <!-- HUVUDMENY -->

      <div class="main-menu">

        <!-- TIMLÖN -->

        <button
          type="button"
          class="menu-button"
          onclick="window.location.href='kalendar.html'">

          <span class="menu-symbol">T</span>

          <span class="menu-text">
            Timlön
          </span>

        </button>


        <!-- MÅNADSLÖN -->

      <!-- MÅNADSLÖN -->

<button
  type="button"
  class="menu-button"
  onclick="window.location.href='manadslon.html'">

  <span class="menu-symbol">M</span>

  <span class="menu-text">
    Månadslön
  </span>

</button>


        <!-- KOLLEKTIVAVTAL -->

     <button
  type="button"
  class="menu-button"
  onclick="window.location.href='kalendar.html?mode=procent'"

  <span class="menu-symbol">%</span>

  <span class="menu-text">
    Kollektivavtal
  </span>

</button>

      </div>


      <!-- FOOTER -->

      <div class="footer">
        Genie
      </div>

    </div>

  </div>

</body>
</html>
