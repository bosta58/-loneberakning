<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Löneberäkning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #1f2937;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: #1f2937;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #111827;
    }

    .subtitle {
      margin-top: 7px;
      color: #6b7280;
      font-size: 15px;
    }

    .section-title {
      margin-top: 26px;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
      color: #111827;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 8px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-top: 6px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      font-size: 16px;
      background: #f9fafb;
      color: #111827;
      outline: none;
    }

    input:focus {
      border-color: #6b7280;
      background: #ffffff;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .calculate {
      background: #111827;
      color: white;
      box-shadow: 0 5px 15px rgba(17, 24, 39, 0.18);
    }

    .calculate:active {
      transform: scale(0.99);
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f3f4f6;
      border-radius: 15px;
      border: 1px solid #e5e7eb;
    }

    .result p {
      margin: 10px 0;
      font-size: 16px;
    }

    .result .gross {
      color: #374151;
    }

    .result .tax {
      color: #b91c1c;
    }

    .result .vacation {
      color: #374151;
    }

    .net-box {
      margin-top: 16px;
      padding: 16px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      text-align: center;
    }

    .net-label {
      display: block;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .total {
      font-size: 25px !important;
      font-weight: bold;
      color: #111827;
      margin: 0 !important;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="header">
        <div class="header-icon">₭</div>

        <h1>Löneberäkning</h1>

        <div class="subtitle">
          Enkel och professionell löneberäkning
        </div>
      </div>

      <div class="section-title">
        Personuppgifter
      </div>

      <label>Namn</label>
      <input type="text" id="name" placeholder="Ange namn">

      <div class="section-title">
        Arbetstid
      </div>

      <label>Ordinarie timmar</label>
      <input type="number" id="regularHours" value="0">

      <label>Övertid timmar</label>
      <input type="number" id="overtimeHours" value="0">

      <label>Natt timmar</label>
      <input type="number" id="nightHours" value="0">

      <label>Helg timmar</label>
      <input type="number" id="weekendHours" value="0">

      <label>Helgdag timmar</label>
      <input type="number" id="holidayHours" value="0">

      <div class="section-title">
        Löneuppgifter
      </div>

      <label>Timlön (kr)</label>
      <input type="number" id="hourlyRate" value="146">

      <label>Övertid tillägg (%)</label>
      <input type="number" id="overtimePercent" value="10">

      <label>Natt tillägg (%)</label>
      <input type="number" id="nightPercent" value="30">

      <label>Helg tillägg (%)</label>
      <input type="number" id="weekendPercent" value="50">

      <label>Helgdag tillägg (%)</label>
      <input type="number" id="holidayPercent" value="100">

      <label>Semesterersättning (%)</label>
      <input type="number" id="holidayPay" value="13">

      <label>Skatt (%)</label>
      <input type="number" id="tax" value="21">

      <button class="calculate" onclick="calculateSalary()">
        Beräkna lön
      </button>

      <div class="hours-buttons">
  <button type="button" onclick="openCalendar('regular')">
    📅 Redovni sati
  </button>

  <button type="button" onclick="openCalendar('overtime')">
    📅 Prekovremeni sati
  </button>

  <button type="button" onclick="openCalendar('other')">
    📅 Ostali sati
  </button>
</div><div class="result" id="result">
        <p>Fyll i uppgifterna och tryck på "Beräkna lön".</p>
      </div>

      <div class="footer">
        Löneberäkning
      </div>

    </div>

  </div>

  <script>
    function openCalendar(type) {
  let title = "";

  if (type === "regular") {
    title = "Redovni sati";
  } else if (type === "overtime") {
    title = "Prekovremeni sati";
  } else {
    title = "Ostali sati";
  }

  alert("Kalendar: " + title);
}function calculateSalary() {

      const regularHours =
        Number(document.getElementById("regularHours").value);

      const overtimeHours =
        Number(document.getElementById("overtimeHours").value);

      const nightHours =
        Number(document.getElementById("nightHours").value);

      const weekendHours =
        Number(document.getElementById("weekendHours").value);

      const holidayHours =
        Number(document.getElementById("holidayHours").value);

      const hourlyRate =
        Number(document.getElementById("hourlyRate").value);

      const overtimePercent =
        Number(document.getElementById("overtimePercent").value);

      const nightPercent =
        Number(document.getElementById("nightPercent").value);

      const weekendPercent =
        Number(document.getElementById("weekendPercent").value);

      const holidayPercent =
        Number(document.getElementById("holidayPercent").value);

      const holidayPay =
        Number(document.getElementById("holidayPay").value);

      const tax =
        Number(document.getElementById("tax").value);

      const regularPay =
        regularHours * hourlyRate;

      const overtimePay =
        overtimeHours * hourlyRate *
        (1 + overtimePercent / 100);

      const nightPay =
        nightHours * hourlyRate *
        (1 + nightPercent / 100);

      const weekendPay =
        weekendHours * hourlyRate *
        (1 + weekendPercent / 100);

      const holidayPayAmount =
        holidayHours * hourlyRate *
        (1 + holidayPercent / 100);

      const baseGross =
        regularPay +
        overtimePay +
        nightPay +
        weekendPay +
        holidayPayAmount;

      const vacationPay =
        baseGross * holidayPay / 100;

      const grossSalary =
        baseGross + vacationPay;

      const taxAmount =
        grossSalary * tax / 100;

      const netSalary =
        grossSalary - taxAmount;

      document.getElementById("result").innerHTML = `

        <p class="gross">
          <strong>Bruttolön:</strong>
          ${grossSalary.toFixed(2)} kr
        </p>

        <p class="vacation">
          <strong>Semesterersättning:</strong>
          ${vacationPay.toFixed(2)} kr
        </p>

        <p class="tax">
          <strong>Skatt:</strong>
          ${taxAmount.toFixed(2)} kr
        </p>

        <div class="net-box">
          <span class="net-label">Nettolön</span>
          <p class="total">
            ${netSalary.toFixed(2)} kr
          </p>
        </div>

      `;
    }
  </script>

</body>
</html>
