<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbetstidskalender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin: 5px 0 18px;
      font-size: 25px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    select,
    button,
    input {
      font-size: 16px;
    }

    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    .month {
      flex: 1;
    }

    .year {
      width: 120px;
    }

    .calendar {
      width: 100%;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .weekday {
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      padding: 8px 2px;
    }

    .day {
      min-height: 75px;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 5px;
      background: #fafafa;
      cursor: pointer;
    }

    .day:hover {
      background: #eef5ff;
    }

    .day-number {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .hours-input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }

    .weekend {
      background: #fff5f5;
    }

    .empty {
      border: none;
      background: transparent;
      cursor: default;
    }

    .summary {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f5f7fa;
    }

    .summary h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #ddd;
    }

    .summary-row:last-child {
      border-bottom: none;
      font-weight: bold;
      font-size: 18px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .save {
      background: #1f7a4d;
      color: white;
    }

    .clear {
      background: #ddd;
      color: #222;
    }

    @media (max-width: 500px) {
      .container {
        padding: 8px;
      }

      .card {
        padding: 10px;
      }

      .day {
        min-height: 68px;
      }

      .hours-input {
        font-size: 14px;
        padding: 5px 2px;
      }

      .weekday {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>📅 Arbetstidskalender</h1>

    <div class="top-row">
      <div class="month">
        <select id="monthSelect"></select>
      </div>

      <div class="year">
        <select id="yearSelect"></select>
      </div>
    </div>

    <div class="calendar">

      <div class="weekdays">
        <div class="weekday">Mån</div>
        <div class="weekday">Tis</div>
        <div class="weekday">Ons</div>
        <div class="weekday">Tor</div>
        <div class="weekday">Fre</div>
        <div class="weekday">Lör</div>
        <div class="weekday">Sön</div>
      </div>

      <div id="days" class="days"></div>

    </div>

    <div class="summary">

      <h2>Sammanställning</h2>

      <div class="summary-row">
        <span>Redovni sati:</span>
        <span id="totalHours">0</span>
      </div>

      <div class="summary-row">
        <span>Antal arbetsdagar:</span>
        <span id="workDays">0</span>
      </div>

    </div>

    <div class="buttons">
      <button class="save" onclick="saveCalendar()">
        💾 Spara
      </button>

      <button class="clear" onclick="clearCalendar()">
        🗑️ Rensa
      </button>
    </div>

  </div>
</div>

<script>

const months = [
  "Januari",
  "Februari",
  "Mars",
  "April",
  "Maj",
  "Juni",
  "Juli",
  "Augusti",
  "September",
  "Oktober",
  "November",
  "December"
];

const monthSelect = document.getElementById("monthSelect");
const yearSelect = document.getElementById("yearSelect");
const daysContainer = document.getElementById("days");

const now = new Date();

let selectedMonth = now.getMonth();
let selectedYear = now.getFullYear();

months.forEach((month, index) => {
  const option = document.createElement("option");
  option.value = index;
  option.textContent = month;
  monthSelect.appendChild(option);
});

for (let year = selectedYear - 2; year <= selectedYear + 3; year++) {
  const option = document.createElement("option");
  option.value = year;
  option.textContent = year;
  yearSelect.appendChild(option);
}

monthSelect.value = selectedMonth;
yearSelect.value = selectedYear;

monthSelect.addEventListener("change", renderCalendar);
yearSelect.addEventListener("change", renderCalendar);

function renderCalendar() {

  selectedMonth = parseInt(monthSelect.value);
  selectedYear = parseInt(yearSelect.value);

  daysContainer.innerHTML = "";

  const firstDay = new Date(
    selectedYear,
    selectedMonth,
    1
  );

  const daysInMonth = new Date(
    selectedYear,
    selectedMonth + 1,
    0
  ).getDate();

  let startDay = firstDay.getDay();

  // Gör söndag till 7 så att måndag blir första dagen
  if (startDay === 0) {
    startDay = 7;
  }

  // Tomma rutor före första dagen
  for (let i = 1; i < startDay; i++) {

    const empty = document.createElement("div");

    empty.className = "day empty";

    daysContainer.appendChild(empty);
  }

  // Dagar
  for (let day = 1; day <= daysInMonth; day++) {

    const date = new Date(
      selectedYear,
      selectedMonth,
      day
    );

    const weekday = date.getDay();

    const dayBox = document.createElement("div");

    dayBox.className = "day";

    if (weekday === 0 || weekday === 6) {
      dayBox.classList.add("weekend");
    }

    const number = document.createElement("div");

    number.className = "day-number";

    number.textContent = day;

    const input = document.createElement("input");

    input.type = "number";
    input.min = "0";
    input.step = "0.5";

    input.className = "hours-input";

    input.placeholder = "tim";

    input.dataset.day = day;

    input.addEventListener("input", updateSummary);

    dayBox.appendChild(number);
    dayBox.appendChild(input);

    daysContainer.appendChild(dayBox);
  }

  loadCalendar();
  updateSummary();
}

function updateSummary() {

  const inputs = document.querySelectorAll(".hours-input");

  let total = 0;
  let workDays = 0;

  inputs.forEach(input => {

    const value = parseFloat(input.value) || 0;

    total += value;

    if (value > 0) {
      workDays++;
    }

  });

  document.getElementById("totalHours").textContent =
    total.toFixed(1);

  document.getElementById("workDays").textContent =
    workDays;
}

function saveCalendar() {

  const data = {};

  const inputs = document.querySelectorAll(".hours-input");

  inputs.forEach(input => {

    const day = input.dataset.day;

    data[day] = input.value;

  });

  const key =
    "calendar_" +
    selectedYear +
    "_" +
    selectedMonth;

  localStorage.setItem(
    key,
    JSON.stringify(data)
  );

  alert("Kalendern är sparad.");
}

function loadCalendar() {

  const key =
    "calendar_" +
    selectedYear +
    "_" +
    selectedMonth;

  const saved =
    localStorage.getItem(key);

  if (!saved) {
    return;
  }

  const data = JSON.parse(saved);

  const inputs =
    document.querySelectorAll(".hours-input");

  inputs.forEach(input => {

    const day = input.dataset.day;

    if (data[day] !== undefined) {
      input.value = data[day];
    }

  });
}

function clearCalendar() {

  if (!confirm("Vill du rensa alla timmar för denna månad?")) {
    return;
  }

  const inputs =
    document.querySelectorAll(".hours-input");

  inputs.forEach(input => {
    input.value = "";
  });

  const key =
    "calendar_" +
    selectedYear +
    "_" +
    selectedMonth;

  localStorage.removeItem(key);

  updateSummary();
}

renderCalendar();

</script>

</body>
</html>
