<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbetstidskalender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin: 5px 0 18px;
      font-size: 25px;
    }

    .language-menu {
      margin-bottom: 15px;
    }

    .language-menu select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 16px;
      text-align: center;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    select,
    button,
    input {
      font-size: 16px;
    }

    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    .month {
      flex: 1;
    }

    .year {
      width: 120px;
    }

    .calendar {
      width: 100%;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .weekday {
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      padding: 8px 2px;
    }

    .day {
      min-height: 82px;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 5px;
      background: #fafafa;
    }

    .day:hover {
      background: #eef5ff;
    }

    .day-number {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .hours-input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }

    .weekend {
      background: #fff5f5;
    }

    .holiday {
      background: #fff0d9;
      border-color: #e6a23c;
    }

    .empty {
      border: none;
      background: transparent;
    }

    .day-type {
      width: 100%;
      margin-top: 4px;
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 11px;
      background: white;
    }

    .summary {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f5f7fa;
    }

    .summary h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #ddd;
    }

    .summary-row:last-child {
      border-bottom: none;
      font-weight: bold;
      font-size: 18px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .save {
      background: #1f7a4d;
      color: white;
    }

    .clear {
      background: #ddd;
      color: #222;
    }

    .navigation-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .navigation-buttons button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-button {
      background: #ddd;
      color: #222;
    }

    .next-button {
      background: #1f2937;
      color: #ffffff !important;
    }

    .navigation-buttons button:active,
    .buttons button:active {
      transform: scale(0.98);
    }

    @media (max-width: 500px) {
      .container {
        padding: 8px;
      }

      .card {
        padding: 10px;
      }

      .day {
        min-height: 78px;
      }

      .hours-input {
        font-size: 14px;
        padding: 5px 2px;
      }

      .weekday {
        font-size: 11px;
      }

      .day-type {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1 id="pageTitle">📅 Arbetstidskalender</h1>

    <!-- SPRÅK -->

    <div class="language-menu">
      <select id="languageSelect">

        <option value="sv">🇸🇪 Svenska</option>
        <option value="en">🇬🇧 English</option>
        <option value="sr">🇷🇸 Srpski</option>

      </select>
    </div>

    <!-- MÅNAD / ÅR -->

    <div class="top-row">

      <div class="month">

    </div>

    <div class="calendar">

      <div class="weekdays">

    <!-- SAMMANSTÄLLNING -->

    <div class="summary">

      <h2 id="summaryTitle">Sammanställning</h2>

      <div class="summary-row">
        <span id="regularWeekdayLabel">Ordinarie vardag:</span>
        <span id="regularWeekday">0.0</span>
      </div>

      <div class="summary-row">
        <span id="overtimeWeekdayLabel">Övertid vardag:</span>
        <span id="overtimeWeekday">0.0</span>
      </div>

      <div class="summary-row">
        <span id="regularWeekendLabel">Ordinarie helg:</span>
        <span id="regularWeekend">0.0</span>
      </div>

      <div class="summary-row">
        <span id="overtimeWeekendLabel">Övertid helg:</span>
        <span id="overtimeWeekend">0.0</span>
      </div>

      <div class="summary-row">
        <span id="regularHolidayLabel">Ordinarie helgdag:</span>
        <span id="regularHoliday">0.0</span>

      <div class="summary-row">
        <span id="overtimeHolidayLabel">Övertid helgdag:</span>
        <span id="overtimeHoliday">0.0</span>
      </div>

      <div class="summary-row">
        <span id="totalHoursLabel">Totalt timmar:</span>
        <span id="totalHours">0.0</span>
      </div>

      <div class="summary-row">
        <span id="workDaysLabel">Antal arbetsdagar:</span>
        <span id="workDays">0</span>
      </div>

    </div>

    <!-- SPARA / RENSA -->

    <div class="buttons">

      <button class="save" onclick="saveCalendar()" id="saveButton">
        💾 Spara
      </button>

      <button class="clear" onclick="clearCalendar()" id="clearButton">
        🗑️ Rensa
      </button>

    </div>

    <!-- NAVIGATION -->

    <div class="navigation-buttons">

      <button
        class="back-button"
        type="button"
        onclick="window.location.href='index.html'"
        id="backButton">
        ← Tillbaka
      </button>

      <button
        class="next-button"
        type="button"
        onclick="continueToSalary()"
        id="nextButton">
        Fortsätt →
      </button>

    </div>

  </div>
</div>

<script>
/* =========================================================
   GENIE – ARBETSTIDSKALENDER
   Obräkningsperiod: 26:e – 25:e
   HTML och CSS lämnas oförändrade
   ========================================================= */

const translations = {

  },

    holiday: "Holiday",
    regular: "Regular weekday",
    overtime: "Overtime weekday",
    weekendRegular: "Regular weekend",
    weekendOvertime: "Overtime weekend",
    holidayRegular: "Regular holiday",
    holidayOvertime: "Overtime holiday",
    total: "Total hours",
    workdays: "Working days",
    save: "Save",
    clear: "Clear",
    continue: "Continue",
    saved: "Calendar saved.",
    cleared: "Calendar cleared."
  },

  sr: {
    title: "Kalendar radnog vremena",
    month: "Mesec",
    year: "Godina",
    weekday: "Radni dan",
    weekend: "Vikend",
    holiday: "Praznik",
    regular: "Redovni sati",
    overtime: "Prekovremeni sati",
    weekendRegular: "Redovni sati vikendom",
    weekendOvertime: "Prekovremeni sati vikendom",
    holidayRegular: "Redovni sati praznikom",
    holidayOvertime: "Prekovremeni sati praznikom",
    total: "Ukupno sati",
    workdays: "Broj radnih dana",
    save: "Sačuvaj",
    clear: "Obriši",
    continue: "Nastavi",
    saved: "Kalendar je sačuvan.",
    cleared: "Kalendar je obrisan."
  }
};

const monthNames = {
  sv: [
    "Januari", "Februari", "Mars", "April", "Maj", "Juni",
    "Juli", "Augusti", "September", "Oktober", "November", "December"
  ],
  en: [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ],
  sr: [
    "Januar", "Februar", "Mart", "April", "Maj", "Jun",
    "Jul", "Avgust", "Septembar", "Oktobar", "Novembar", "Decembar"
  ]
};

const weekdayNames = {
  sv: ["Sön", "Mån", "Tis", "Ons", "Tor", "Fre", "Lör"],
  en: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
  sr: ["Ned", "Pon", "Uto", "Sre", "Čet", "Pet", "Sub"]
};

let currentLanguage = localStorage.getItem("genieLanguage") || "sv";

const monthSelect = document.getElementById("monthSelect");
const yearSelect = document.getElementById("yearSelect");
const daysContainer = document.getElementById("daysContainer");


/* =========================================================
   HJÄLPFUNKTIONER
   ========================================================= */

function pad(n) {
  return String(n).padStart(2, "0");
}

function makeDateKey(date) {
  return (
    date.getFullYear() +
    "-" +
    pad(date.getMonth() + 1) +
    "-" +
    pad(date.getDate())
  );
}


/*
   OBRAČUNSKI PERIOD

   Ako je izabrani datum 1–25:
   period = 26. prethodnog meseca → 25. ovog meseca

   Ako je izabrani datum 26–31:
   period = 26. ovog meseca → 25. sledećeg meseca
*/
function getPayPeriodForSelectedMonth() {
  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);

  /*
     Kao referentni datum koristimo 25. dan izabranog meseca.
     Tako će izabrani mesec predstavljati:
     prethodni 26. → trenutni 25.
  */
  const referenceDate = new Date(year, month, 25);

  const periodStart = new Date(
    referenceDate.getFullYear(),
    referenceDate.getMonth() - 1,
    26
  );

  const periodEnd = new Date(
    referenceDate.getFullYear(),
    referenceDate.getMonth(),
    25
  );

  return {
    start: periodStart,
    end: periodEnd,
    startString: makeDateKey(periodStart),
    endString: makeDateKey(periodEnd)
  };
}


/*
   Läser sparad dagdata för en viss månad.
*/
function loadMonthData(year, month) {
  const key = `calendar_${year}_${month}`;

  try {
    return JSON.parse(localStorage.getItem(key)) || {};
  } catch (error) {
    return {};
  }
}


/*
   Hämtar data för en specifik dag.
*/
function getSavedDayData(date) {
  const year = date.getFullYear();
  const month = date.getMonth();
  const day = date.getDate();

  const monthData = loadMonthData(year, month);

  return monthData[day] || null;
}


/*
   Räknar timmar enligt befintlig Genie-regel:
   första 8 timmar = ordinarie
   resten = övertid
*/
function splitHours(hours) {
  const value = Number(hours) || 0;

  return {
    regular: Math.min(value, 8),
    overtime: Math.max(value - 8, 0)
  };
}


/* =========================================================
   SVENSKA HELGDAGAR
   ========================================================= */

function getSwedishHoliday(date) {
  const year = date.getFullYear();
  const month = date.getMonth();
  const day = date.getDate();

  /* Fasta helgdagar */
  if (
    (month === 0 && (day === 1 || day === 6)) ||
    (month === 4 && day === 1) ||
    (month === 5 && day === 6) ||
    (month === 11 && (day === 25 || day === 26))
  ) {
    return true;
  }

  /* Påskberäkning */
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);

  const easterMonth = Math.floor((h + l - 7 * m + 114) / 31) - 1;
  const easterDay = ((h + l - 7 * m + 114) % 31) + 1;

  const easterSunday = new Date(
    year,
    easterMonth,
    easterDay
  );

  const goodFriday = new Date(easterSunday);
  goodFriday.setDate(goodFriday.getDate() - 2);

  const easterMonday = new Date(easterSunday);
  easterMonday.setDate(easterMonday.getDate() + 1);

  const ascension = new Date(easterSunday);
  ascension.setDate(ascension.getDate() + 39);

  const midsummer = getMidsummerDay(year);
  const allSaints = getAllSaintsDay(year);

  return (
    sameDate(date, goodFriday) ||
    sameDate(date, easterSunday) ||
    sameDate(date, easterMonday) ||
    sameDate(date, ascension) ||
    sameDate(date, midsummer) ||
    sameDate(date, allSaints)
  );
}


function sameDate(a, b) {
  return (
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate()
  );
}


/* Midsommardagen – lördag mellan 20 och 26 juni */
function getMidsummerDay(year) {
  for (let day = 20; day <= 26; day++) {
    const date = new Date(year, 5, day);

    if (date.getDay() === 6) {
      return date;
    }
  }

  return null;
}


/* Alla helgons dag – lördag mellan 31 oktober och 6 november */
function getAllSaintsDay(year) {
  for (let day = 31; day <= 36; day++) {
    const date = new Date(year, 9, day);

    if (date.getDay() === 6) {
      return date;
    }
  }

  return null;
}


/* =========================================================
   MÅNAD / ÅR
   ========================================================= */

function renderMonths() {
  const t = translations[currentLanguage];

  if (!monthSelect || !yearSelect) return;

  monthSelect.innerHTML = "";

  monthNames[currentLanguage].forEach((name, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = name;
    monthSelect.appendChild(option);
  });

  const now = new Date();
  const selectedYear = Number(yearSelect.value) || now.getFullYear();

  monthSelect.value = String(
    monthSelect.value || now.getMonth()
  );

  /*
     Återställ årsväljaren
  */
  yearSelect.innerHTML = "";

  for (
    let year = selectedYear - 2;
    year <= selectedYear + 3;
    year++
  ) {
    const option = document.createElement("option");
    option.value = year;
    option.textContent = year;
    yearSelect.appendChild(option);
  }

  yearSelect.value = String(selectedYear);
}


/* =========================================================
   KALENDER
   ========================================================= */

function renderCalendar() {
  if (!daysContainer) return;

  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);

  daysContainer.innerHTML = "";

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  /*
     Tomma celler före första dagen
  */
  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day-box empty";
    daysContainer.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);

    const dayBox = document.createElement("div");
    dayBox.className = "day-box";

    if (date.getDay() === 0 || date.getDay() === 6) {
      dayBox.classList.add("weekend");
    }

    const holiday = getSwedishHoliday(date);

    if (holiday) {
      dayBox.classList.add("holiday");
    }

    const weekdayLabel = document.createElement("div");
    weekdayLabel.className = "weekday-label";
    weekdayLabel.textContent = weekdayNames[currentLanguage][date.getDay()];

    const dateLabel = document.createElement("div");
    dateLabel.className = "date-label";
    dateLabel.textContent = day;

    const input = document.createElement("input");
    input.type = "number";
    input.min = "0";
    input.step = "0.5";
    input.className = "hours-input";
    input.dataset.day = day;

    const select = document.createElement("select");
    select.className = "day-type";

    /*
       Vardag / Helg / Helgdag
    */
    if (date.getDay() === 0 || date.getDay() === 6) {
      const weekendOption = document.createElement("option");
      weekendOption.value = "weekend";
      weekendOption.textContent = translations[currentLanguage].weekend;
      select.appendChild(weekendOption);

      const holidayOption = document.createElement("option");
      holidayOption.value = "holiday";
      holidayOption.textContent = translations[currentLanguage].holiday;
      select.appendChild(holidayOption);
    } else {
      const weekdayOption = document.createElement("option");
      weekdayOption.value = "weekday";
      weekdayOption.textContent = translations[currentLanguage].weekday;
      select.appendChild(weekdayOption);

      const holidayOption = document.createElement("option");
      holidayOption.value = "holiday";
      holidayOption.textContent = translations[currentLanguage].holiday;
      select.appendChild(holidayOption);
    }

    /*
       Helgdag väljs automatiskt
    */
    if (holiday) {
      select.value = "holiday";
    }

    const saved = getSavedDayData(date);

    if (saved) {
      input.value = saved.hours ?? "";

      if (saved.type) {
        select.value = saved.type;
      }
    }

    input.addEventListener("input", function () {
      updateDayAppearance(dayBox, select.value);
      updateSummary();
    });

    select.addEventListener("change", function () {
      updateDayAppearance(dayBox, select.value);
      updateSummary();
    });

    dayBox.appendChild(weekdayLabel);
    dayBox.appendChild(dateLabel);
    dayBox.appendChild(input);
    dayBox.appendChild(select);

    daysContainer.appendChild(dayBox);
  }

  updateSummary();
}


/* =========================================================
   DAGENS UTSEENDE
   ========================================================= */

function updateDayAppearance(dayBox, type) {
  dayBox.classList.remove("weekend", "holiday");

  if (type === "weekend") {
    dayBox.classList.add("weekend");
  }

  if (type === "holiday") {
    dayBox.classList.add("holiday");
  }
}


/* =========================================================
   SPARA AKTUELL MÅNAD
   ========================================================= */

function saveCalendar() {
  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);

  const data = {};

  document.querySelectorAll(".hours-input").forEach(input => {
    const day = input.dataset.day;
    const typeElement =
      input.parentElement.querySelector(".day-type");

    data[day] = {
      hours: input.value,
      type: typeElement ? typeElement.value : "weekday"
    };
  });

  const key = `calendar_${year}_${month}`;

  localStorage.setItem(key, JSON.stringify(data));

  /*
     Viktigt:
     Spara samtidigt hela obräkningsperioden till salaryHours.
  */
  savePayPeriodData();

  alert(translations[currentLanguage].saved);
}


/* =========================================================
   LADDA AKTUELL MÅNAD
   ========================================================= */

function loadCalendar() {
  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);

  const data = loadMonthData(year, month);

  document.querySelectorAll(".hours-input").forEach(input => {
    const day = input.dataset.day;

    if (data[day]) {
      input.value = data[day].hours ?? "";

      const typeElement =
        input.parentElement.querySelector(".day-type");

      if (typeElement && data[day].type) {
        typeElement.value = data[day].type;
      }
    }
  });
}


/* =========================================================
   RÄKNA SAMMAN HELA OBRÄKNINGSPERIODEN
   ========================================================= */

function calculatePayPeriodHours() {
  const period = getPayPeriodForSelectedMonth();

  const result = {
    regularHours: 0,
    regularOvertimeHours: 0,
    nightHours: 0,
    nightOvertimeHours: 0,
    weekendHours: 0,
    weekendOvertimeHours: 0,
    holidayHours: 0,
    holidayOvertimeHours: 0
  };

  /*
     Gå igenom varje dag från 26:e till 25:e.
  */
  const current = new Date(period.start);

  while (current <= period.end) {
    const savedDay = getSavedDayData(current);

    if (savedDay) {
      const hours = Number(savedDay.hours) || 0;
      const type = savedDay.type || "weekday";

      if (hours > 0) {
        const split = splitHours(hours);

        if (type === "holiday") {
          result.holidayHours += split.regular;
          result.holidayOvertimeHours += split.overtime;
        } else if (type === "weekend") {
          result.weekendHours += split.regular;
          result.weekendOvertimeHours += split.overtime;
        } else {
          result.regularHours += split.regular;
          result.regularOvertimeHours += split.overtime;
        }

        /*
           Om äldre sparad data redan innehåller
           nattarbete behåller vi dessa värden.
           Vi hittar inte på någon ny nattregel här.
        */
        result.nightHours += Number(savedDay.nightHours) || 0;
        result.nightOvertimeHours +=
          Number(savedDay.nightOvertimeHours) || 0;
      }
    }

    current.setDate(current.getDate() + 1);
  }

  return result;
}


/* =========================================================
   SPARA HELA PERIODEN TILL GENIE
   ========================================================= */

function savePayPeriodData() {
  const period = getPayPeriodForSelectedMonth();
  const result = calculatePayPeriodHours();

  /*
     Detta är den viktiga ändringen.

     salaryHours innehåller nu hela obräkningsperioden,
     inte bara den månad som visas på skärmen.
  */
  const salaryHours = {
    regularHours: result.regularHours,
    regularOvertimeHours: result.regularOvertimeHours,

    nightHours: result.nightHours,
    nightOvertimeHours: result.nightOvertimeHours,

    weekendHours: result.weekendHours,
    weekendOvertimeHours: result.weekendOvertimeHours,

    holidayHours: result.holidayHours,
    holidayOvertimeHours: result.holidayOvertimeHours,

    periodStart: period.startString,
    periodEnd: period.endString
  };

  localStorage.setItem(
    "salaryHours",
    JSON.stringify(salaryHours)
  );

  /*
     Timlön-sidan använder redan dessa nycklar.
     Därför behöver vi inte ändra lon.html.
  */
  localStorage.setItem(
    "timlon_periodStart",
    period.startString
  );

  localStorage.setItem(
    "timlon_periodEnd",
    period.endString
  );

  /*
     Gemensamma periodnycklar för Genie.
  */
  localStorage.setItem(
    "genieCalendarPeriodStart",
    period.startString
  );

  localStorage.setItem(
    "genieCalendarPeriodEnd",
    period.endString
  );

  return salaryHours;
}


/* =========================================================
   AKTUELL MÅNADS VISNING
   ========================================================= */

function updateSummary() {
  let regularHours = 0;
  let regularOvertimeHours = 0;

  let weekendHours = 0;
  let weekendOvertimeHours = 0;

  let holidayHours = 0;
  let holidayOvertimeHours = 0;

  let totalHours = 0;
  let workdays = 0;

  /*
     Den synliga sammanfattningen fortsätter visa
     den månad som användaren tittar på.

     MEN salaryHours sparas alltid för hela
     obräkningsperioden 26–25.
  */
  document.querySelectorAll(".hours-input").forEach(input => {
    const hours = Number(input.value) || 0;

    if (hours <= 0) return;

    totalHours += hours;
    workdays++;

    const split = splitHours(hours);

    const typeElement =
      input.parentElement.querySelector(".day-type");

    const type = typeElement
      ? typeElement.value
      : "weekday";

    if (type === "holiday") {
      holidayHours += split.regular;
      holidayOvertimeHours += split.overtime;
    } else if (type === "weekend") {
      weekendHours += split.regular;
      weekendOvertimeHours += split.overtime;
    } else {
      regularHours += split.regular;
      regularOvertimeHours += split.overtime;
    }
  });

  /*
     Befintliga summary-element.
  */
  const values = {
    regularHours,
    regularOvertimeHours,
    weekendHours,
    weekendOvertimeHours,
    holidayHours,
    holidayOvertimeHours,
    totalHours,
    workdays
  };

  setSummaryValue("regularHours", values.regularHours);
  setSummaryValue("regularOvertimeHours", values.regularOvertimeHours);
  setSummaryValue("weekendHours", values.weekendHours);
  setSummaryValue("weekendOvertimeHours", values.weekendOvertimeHours);
  setSummaryValue("holidayHours", values.holidayHours);
  setSummaryValue("holidayOvertimeHours", values.holidayOvertimeHours);
  setSummaryValue("totalHours", values.totalHours);
  setSummaryValue("workdays", values.workdays);

  /*
     VIKTIGT:
     salaryHours = hela obräkningsperioden.
  */
  savePayPeriodData();
}


function setSummaryValue(name, value) {
  /*
     Försök hitta vanliga ID-varianter utan att ändra HTML.
  */

  const candidates = [
    name,
    "summary" + capitalize(name),
    "calendar" + capitalize(name)
  ];

  for (const id of candidates) {
    const element = document.getElementById(id);

    if (element) {
      if (
        element.tagName === "INPUT" ||
        element.tagName === "TEXTAREA"
      ) {
        element.value = Number(value).toFixed(1);
      } else {
        element.textContent = Number(value).toFixed(1);
      }

      return;
    }
  }
}


function capitalize(text) {
  return text.charAt(0).toUpperCase() + text.slice(1);
}


/* =========================================================
   RADERA AKTUELL MÅNAD
   ========================================================= */

function clearCalendar() {
  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);

  document.querySelectorAll(".hours-input").forEach(input => {
    input.value = "";
  });

  const key = `calendar_${year}_${month}`;

  localStorage.removeItem(key);

  updateSummary();

  alert(translations[currentLanguage].cleared);
}


/* =========================================================
   FORTSÄTT TILL LÖN
   ========================================================= */

function continueToSalary() {
  /*
     Först sparas hela obräkningsperioden.
  */
  savePayPeriodData();

  const params = new URLSearchParams(window.location.search);

  if (params.get("mode") === "procent") {
    window.location.href = "procent.html";
  } else {
    window.location.href = "lon.html";
  }
}


/* =========================================================
   SPRÅK
   ========================================================= */

function applyLanguage() {
  const t = translations[currentLanguage];

  /*
     Försök uppdatera befintliga textfält utan att ändra
     HTML-strukturen.
  */

  const map = {
    title: t.title,
    monthLabel: t.month,
    yearLabel: t.year,
    regularLabel: t.regular,
    overtimeLabel: t.overtime,
    weekendRegularLabel: t.weekendRegular,
    weekendOvertimeLabel: t.weekendOvertime,
    holidayRegularLabel: t.holidayRegular,
    holidayOvertimeLabel: t.holidayOvertime,
    totalLabel: t.total,
    workdaysLabel: t.workdays,
    saveButton: t.save,
    clearButton: t.clear,
    continueButton: t.continue
  };

  Object.keys(map).forEach(id => {
    const element = document.getElementById(id);

    if (element) {
      element.textContent = map[id];
    }
  });

  renderMonths();
  renderCalendar();
}


/* =========================================================
   EVENT
   ========================================================= */

if (monthSelect) {
  monthSelect.addEventListener("change", function () {
    renderCalendar();
  });
}

if (yearSelect) {
  yearSelect.addEventListener("change", function () {
    renderCalendar();
  });
}


/* =========================================================
   SPRÅKVÄLJARE
   ========================================================= */

const languageSelect =
  document.getElementById("languageSelect");

if (languageSelect) {
  languageSelect.value = currentLanguage;

  languageSelect.addEventListener("change", function () {
    currentLanguage = this.value;

    localStorage.setItem(
      "genieLanguage",
      currentLanguage
    );

    applyLanguage();
  });
}


/* =========================================================
   START
   ========================================================= */

(function initCalendar() {
  const now = new Date();

  if (yearSelect) {
    yearSelect.value = String(now.getFullYear());
  }

  if (monthSelect) {
    monthSelect.value = String(now.getMonth());
  }

  renderMonths();

  if (monthSelect) {
    monthSelect.value = String(now.getMonth());
  }

  if (yearSelect) {
    yearSelect.value = String(now.getFullYear());
  }

  renderCalendar();
})();
</script>
