<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbetstidskalender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin: 5px 0 18px;
      font-size: 25px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    select,
    button,
    input {
      font-size: 16px;
    }

    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    .month {
      flex: 1;
    }

    .year {
      width: 120px;
    }

    .calendar {
      width: 100%;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .weekday {
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      padding: 8px 2px;
    }

    .day {
      min-height: 82px;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 5px;
      background: #fafafa;
    }

    .day:hover {
      background: #eef5ff;
    }

    .day-number {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .hours-input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }

    .weekend {
      background: #fff5f5;
    }

    .holiday {
      background: #fff0d9;
      border-color: #e6a23c;
    }

    .empty {
      border: none;
      background: transparent;
    }

    .day-type {
      width: 100%;
      margin-top: 4px;
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 11px;
      background: white;
    }

    .summary {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f5f7fa;
    }

    .summary h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #ddd;
    }

    .summary-row:last-child {
      border-bottom: none;
      font-weight: bold;
      font-size: 18px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .save {
      background: #1f7a4d;
      color: white;
    }

    .clear {
      background: #ddd;
      color: #222;
    }

    @media (max-width: 500px) {
      .container {
        padding: 8px;
      }

      .card {
        padding: 10px;
      }

      .day {
        min-height: 78px;
      }

      .hours-input {
        font-size: 14px;
        padding: 5px 2px;
      }

      .weekday {
        font-size: 11px;
      }

      .day-type {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>📅 Arbetstidskalender</h1>

    <div class="top-row">

      <div class="month">
        <select id="monthSelect"></select>
      </div>

      <div class="year">
        <select id="yearSelect"></select>
      </div>

    </div>

    <div class="calendar">

      <div class="weekdays">
        <div class="weekday">Mån</div>
        <div class="weekday">Tis</div>
        <div class="weekday">Ons</div>
        <div class="weekday">Tor</div>
        <div class="weekday">Fre</div>
        <div class="weekday">Lör</div>
        <div class="weekday">Sön</div>
      </div>

      <div id="days" class="days"></div>

    </div>

    <div class="summary">

      <h2>Sammanställning</h2>

      <div class="summary-row">
        <span>Ordinarie vardag:</span>
        <span id="regularWeekday">0.0</span>
      </div>

      <div class="summary-row">
        <span>Övertid vardag:</span>
        <span id="overtimeWeekday">0.0</span>
      </div>

      <div class="summary-row">
        <span>Ordinarie helg:</span>
        <span id="regularWeekend">0.0</span>
      </div>

      <div class="summary-row">
        <span>Övertid helg:</span>
        <span id="overtimeWeekend">0.0</span>
      </div>

      <div class="summary-row">
        <span>Ordinarie helgdag:</span>
        <span id="regularHoliday">0.0</span>
      </div>

      <div class="summary-row">
        <span>Övertid helgdag:</span>
        <span id="overtimeHoliday">0.0</span>
      </div>

      <div class="summary-row">
        <span>Totalt timmar:</span>
        <span id="totalHours">0.0</span>
      </div>

      <div class="summary-row">
        <span>Antal arbetsdagar:</span>
        <span id="workDays">0</span>
      </div>

    </div>

    <div class="buttons">

      <button class="save" onclick="saveCalendar()">
        💾 Spara
      </button>

      <button class="clear" onclick="clearCalendar()">
        🗑️ Rensa
      </button>

    </div>

  </div>
</div>

<script>

const months = [
  "Januari",
  "Februari",
  "Mars",
  "April",
  "Maj",
  "Juni",
  "Juli",
  "Augusti",
  "September",
  "Oktober",
  "November",
  "December"
];

const monthSelect =
  document.getElementById("monthSelect");

const yearSelect =
  document.getElementById("yearSelect");

const daysContainer =
  document.getElementById("days");

const now = new Date();

let selectedMonth = now.getMonth();
let selectedYear = now.getFullYear();

months.forEach((month, index) => {

  const option =
    document.createElement("option");

  option.value = index;
  option.textContent = month;

  monthSelect.appendChild(option);

});

for (
  let year = selectedYear - 2;
  year <= selectedYear + 3;
  year++
) {

  const option =
    document.createElement("option");

  option.value = year;
  option.textContent = year;

  yearSelect.appendChild(option);

}

monthSelect.value = selectedMonth;
yearSelect.value = selectedYear;

monthSelect.addEventListener(
  "change",
  renderCalendar
);

yearSelect.addEventListener(
  "change",
  renderCalendar
);



function getSwedishHoliday(date) {

  const year = date.getFullYear();
  const month = date.getMonth();
  const day = date.getDate();

  // Fiksni praznici
  if (month === 0 && day === 1) return "Nyårsdagen";
  if (month === 0 && day === 6) return "Trettondedag jul";
  if (month === 4 && day === 1) return "Första maj";
  if (month === 5 && day === 6) return "Sveriges nationaldag";
  if (month === 11 && day === 25) return "Juldagen";
  if (month === 11 && day === 26) return "Annandag jul";

  // Uskrs
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);

  const easterMonth =
    Math.floor((h + l - 7 * m + 114) / 31) - 1;

  const easterDay =
    ((h + l - 7 * m + 114) % 31) + 1;

  const easter = new Date(
    year,
    easterMonth,
    easterDay
  );

  const diff = Math.round(
    (date - easter) / 86400000
  );

  // Pokretni praznici
  if (diff === -2) return "Långfredagen";
  if (diff === 0) return "Påskdagen";
  if (diff === 1) return "Annandag påsk";
  if (diff === 39) return "Kristi himmelsfärdsdag";

  // Midsommardagen – subota između 20. i 26. juna
  if (
    month === 5 &&
    day >= 20 &&
    day <= 26 &&
    date.getDay() === 6
  ) {
    return "Midsommardagen";
  }

  // Alla helgons dag – subota između 31. oktobra i 6. novembra
  if (
    (month === 9 && day >= 31 && date.getDay() === 6) ||
    (month === 10 && day <= 6 && date.getDay() === 6)
  ) {
    return "Alla helgons dag";
  }

  return "";
}
function renderCalendar() {

  selectedMonth =
    parseInt(monthSelect.value);

  selectedYear =
    parseInt(yearSelect.value);

  daysContainer.innerHTML = "";

  const firstDay =
    new Date(
      selectedYear,
      selectedMonth,
      1
    );

  const daysInMonth =
    new Date(
      selectedYear,
      selectedMonth + 1,
      0
    ).getDate();

  let startDay =
    firstDay.getDay();

  if (startDay === 0) {
    startDay = 7;
  }

  for (
    let i = 1;
    i < startDay;
    i++
  ) {

    const empty =
      document.createElement("div");

    empty.className =
      "day empty";

    daysContainer.appendChild(empty);

  }


  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const date =
      new Date(
        selectedYear,
        selectedMonth,
        day
      );

    const weekday =
      date.getDay();

    const dayBox =
      document.createElement("div");

    dayBox.className = "day";


    if (
      weekday === 0 ||
      weekday === 6
    ) {

      dayBox.classList.add(
        "weekend"
      );

    }


    const number =
      document.createElement("div");

    number.className =
      "day-number";

    number.textContent = day;


    const input =
      document.createElement("input");

    input.type = "number";
    input.min = "0";
    input.step = "0.5";

    input.className =
      "hours-input";

    input.placeholder = "tim";

    input.dataset.day = day;


    const typeSelect =
      document.createElement("select");

    typeSelect.className =
      "day-type";

    typeSelect.innerHTML = `
      <option value="weekday">
        Vardag
      </option>

      <option value="holiday">
        Helgdag
      </option>
    `;


    if (
      weekday === 0 ||
      weekday === 6
    ) {

      typeSelect.value =
        "weekend";

      typeSelect.innerHTML = `
        <option value="weekend">
          Helg
        </option>

        <option value="holiday">
          Helgdag
        </option>
      `;

    }
    
const holidayDate =
  new Date(
    selectedYear,
    selectedMonth,
    day
  );

const holidayName =
  getSwedishHoliday(holidayDate);

if (holidayName) {

  typeSelect.value = "holiday";

  dayBox.classList.add("holiday");

}
    typeSelect.addEventListener(
      "change",
      function() {

        updateDayAppearance(
          dayBox,
          typeSelect.value
        );

        updateSummary();

      }
    );


    input.addEventListener(
      "input",
      updateSummary
    );


    dayBox.appendChild(number);
    dayBox.appendChild(input);
    dayBox.appendChild(typeSelect);

    daysContainer.appendChild(dayBox);

  }

  loadCalendar();
  updateSummary();

}


function updateDayAppearance(
  dayBox,
  type
) {

  dayBox.classList.remove(
    "weekend",
    "holiday"
  );

  if (type === "weekend") {

    dayBox.classList.add(
      "weekend"
    );

  }

  if (type === "holiday") {

    dayBox.classList.add(
      "holiday"
    );

  }

}


function updateSummary() {

  const inputs =
    document.querySelectorAll(
      ".hours-input"
    );

  const types =
    document.querySelectorAll(
      ".day-type"
    );


  let regularWeekday = 0;
  let overtimeWeekday = 0;

  let regularWeekend = 0;
  let overtimeWeekend = 0;

  let regularHoliday = 0;
  let overtimeHoliday = 0;

  let total = 0;
  let workDays = 0;


  inputs.forEach(
    (input, index) => {

      const value =
        parseFloat(input.value) || 0;

      const type =
        types[index].value;


      if (value > 0) {
        workDays++;
      }

      total += value;


      const regular =
        Math.min(value, 8);

      const overtime =
        Math.max(value - 8, 0);


      if (type === "weekday") {

        regularWeekday += regular;
        overtimeWeekday += overtime;

      }

      else if (
        type === "weekend"
      ) {

        regularWeekend += regular;
        overtimeWeekend += overtime;

      }

      else if (
        type === "holiday"
      ) {

        regularHoliday += regular;
        overtimeHoliday += overtime;

      }

    }
  );


  document.getElementById(
    "regularWeekday"
  ).textContent =
    regularWeekday.toFixed(1);


  document.getElementById(
    "overtimeWeekday"
  ).textContent =
    overtimeWeekday.toFixed(1);


  document.getElementById(
    "regularWeekend"
  ).textContent =
    regularWeekend.toFixed(1);


  document.getElementById(
    "overtimeWeekend"
  ).textContent =
    overtimeWeekend.toFixed(1);


  document.getElementById(
    "regularHoliday"
  ).textContent =
    regularHoliday.toFixed(1);


  document.getElementById(
    "overtimeHoliday"
  ).textContent =
    overtimeHoliday.toFixed(1);


  document.getElementById(
    "totalHours"
  ).textContent =
    total.toFixed(1);


  document.getElementById(
    "workDays"
  ).textContent =
    workDays;

}


function saveCalendar() {

  const data = {};

  const inputs =
    document.querySelectorAll(
      ".hours-input"
    );

  const types =
    document.querySelectorAll(
      ".day-type"
    );


  inputs.forEach(
    (input, index) => {

      const day =
        input.dataset.day;

      data[day] = {

        hours: input.value,

        type: types[index].value

      };

    }
  );


  const key =
    "calendar_" +
    selectedYear +
    "_" +
    selectedMonth;


  localStorage.setItem(
    key,
    JSON.stringify(data)
  );


  alert(
    "Kalendern är sparad."
  );

}


function loadCalendar() {

  const key =
    "calendar_" +
    selectedYear +
    "_" +
    selectedMonth;


  const saved =
    localStorage.getItem(key);


  if (!saved) {
    return;
  }


  const data =
    JSON.parse(saved);


  const inputs =
    document.querySelectorAll(
      ".hours-input"
    );

  const types =
    document.querySelectorAll(
      ".day-type"
    );


  inputs.forEach(
    (input, index) => {

      const day =
        input.dataset.day;


      if (
        data[day] !== undefined
      ) {

        /*
          Nytt format:
          data[day] = {
            hours: "10",
            type: "weekend"
          }
        */

        if (
          typeof data[day] ===
          "object"
        ) {

          input.value =
            data[day].hours || "";

          types[index].value =
            data[day].type ||
            "weekday";

        }

        /*
          Stöd för gamla sparade
          kalendrar med bara timmar.
        */

        else {

          input.value =
            data[day];

        }

        updateDayAppearance(
          input.parentElement,
          types[index].value
        );

      }

    }
  );

}


function clearCalendar() {

  if (
    !confirm(
      "Vill du rensa alla timmar för denna månad?"
    )
  ) {

    return;

  }


  const inputs =
    document.querySelectorAll(
      ".hours-input"
    );


  inputs.forEach(
    input => {

      input.value = "";

    }
  );


  const key =
    "calendar_" +
    selectedYear +
    "_" +
    selectedMonth;


  localStorage.removeItem(key);

  updateSummary();

}


renderCalendar();

</script>

</body>
</html>
