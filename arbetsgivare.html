<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Genie – Arbetsgivare</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #1f2937;
    }

    .container {
      max-width: 640px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 10px;
      border-radius: 18px;
      background: #1f2937;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #111827;
    }

    .subtitle {
      margin-top: 7px;
      color: #6b7280;
      font-size: 15px;
    }

    .company-card {
      margin-bottom: 22px;
      padding: 18px;
      border-radius: 17px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      text-align: center;
    }

    .company-logo {
      display: block;
      max-width: 180px;
      max-height: 100px;
      margin: 0 auto 14px;
      border-radius: 12px;
      object-fit: contain;
    }

    .company-name {
      font-size: 19px;
      font-weight: 700;
      color: #111827;
      white-space: pre-wrap;
    }

    .company-info {
      margin-top: 7px;
      color: #6b7280;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .section-title {
      font-size: 19px;
      font-weight: 700;
      color: #111827;
      text-align: center;
      margin: 22px 0 12px;
    }

    .employee-count {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .employee-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .employee-name {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
      white-space: pre-wrap;
    }

    .employee-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .view-button {
      background: #1f2937;
      color: #ffffff;
    }

    .contact-button {
      background: #e5e7eb;
      color: #111827;
    }

    .add-button {
      margin-top: 8px;
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .back-button {
      margin-top: 20px;
      background: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .message-status {
      margin-top: 10px;
      padding: 9px;
      border-radius: 9px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      font-size: 13px;
      color: #6b7280;
      white-space: pre-wrap;
    }

    .details-card {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 17px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .details-title {
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 18px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #6b7280;
    }

    .info-value {
      color: #111827;
      font-weight: 700;
      text-align: right;
      white-space: pre-wrap;
    }

    .pay-type {
      margin: 0 auto 16px;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 20px;
      background: #1f2937;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .salary-section {
      margin-top: 18px;
      padding-top: 8px;
    }

    .salary-section-title {
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111827;
    }

    .message-card {
      margin-top: 12px;
      padding: 13px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
    }

    .message-text {
      white-space: pre-wrap;
      margin: 8px 0;
    }

    .reply-text {
      white-space: pre-wrap;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
    }

    .status-fixed {
      color: #166534;
      font-weight: 700;
    }

    .status-new {
      color: #92400e;
      font-weight: 700;
    }

    .close-button {
      margin-top: 18px;
      background: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 15px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="header">

      <div class="header-icon">
        G
      </div>

      <h1>
        Genie
      </h1>

      <div class="subtitle">
        Arbetsgivare
      </div>

    </div>


    <!-- FÖRETAGSINFORMATION -->

    <div class="company-card">

      <img
        id="companyLogo"
        class="company-logo"
        style="display:none;"
        alt="Företagslogotyp">

      <div
        id="companyName"
        class="company-name">
      </div>

      <div
        id="companyInfo"
        class="company-info">
      </div>

    </div>


    <!-- ANSTÄLLDA -->

    <div class="section-title">
      Anställda
    </div>

    <div
      id="employeeCount"
      class="employee-count">
    </div>

    <div id="employeeList"></div>

    <button
      type="button"
      class="add-button"
      onclick="addEmployee()">

      ＋ Lägg till anställd

    </button>


    <!-- DETALJER -->

    <div
      id="detailsCard"
      class="details-card">

      <div
        id="detailsTitle"
        class="details-title">
      </div>

      <div
        id="payType"
        class="pay-type">
      </div>

      <div id="detailsContent"></div>

      <div class="salary-section">

        <div class="salary-section-title">
          💬 Kommunikation
        </div>

        <div id="employeeMessages"></div>

      </div>

      <button
        type="button"
        class="close-button"
        onclick="closeEmployee()">

        ← Stäng

      </button>

    </div>


    <!-- TILLBAKA -->

    <button
      type="button"
      class="back-button"
      onclick="window.location.href='index.html'">

      ← Tillbaka

    </button>


    <div class="footer">
      Genie – Enkel och transparent löneberäkning
    </div>

  </div>

</div>


<script>

  // ==========================================
  // DATA
  // ==========================================

  let employees =
    JSON.parse(
      localStorage.getItem("genieEmployees")
    ) || [];

  let selectedEmployeeIndex = null;


  // ==========================================
  // HJÄLPFUNKTIONER
  // ==========================================

  function normalizeName(name) {

    return String(name || "")
      .trim()
      .toLowerCase();

  }


  function getEmployeeNameFromData(data) {

    return normalizeName(
      data && data.employee
        ? data.employee
        : ""
    );

  }


  function getActiveSalaryRecord(employeeName) {

    const normalized =
      normalizeName(employeeName);


    const activeMap =
      JSON.parse(
        localStorage.getItem(
          "genieActiveSalaryTypes"
        )
      ) || {};


    const active =
      activeMap[normalized];


    if (
      active &&
      active.type
    ) {

      return active;

    }


    /*
      Äldre data utan aktiv markering.

      Vi använder endast denna fallback
      om ingen aktiv typ ännu finns.
    */

    const monthlyData =
      JSON.parse(
        localStorage.getItem(
          "genieManadslonData"
        )
      ) || null;


    const timlonData =
      JSON.parse(
        localStorage.getItem(
          "genieTimlonData"
        )
      ) || null;


    const kollektivList =
      JSON.parse(
        localStorage.getItem(
          "employerSalaryList"
        )
      ) || [];


    const kollektivData =
      kollektivList
        .filter(function(item) {

          return (
            getEmployeeNameFromData(item)
            ===
            normalized
          );

        })
        .pop() || null;


    /*
      För gamla data använder vi den senast
      uppdaterade posten där tidsstämpel finns.
    */

    const candidates = [];


    if (
      monthlyData &&
      getEmployeeNameFromData(monthlyData)
        === normalized
    ) {

      candidates.push({

        type: "Månadslön",

        data: monthlyData,

        updated:
          monthlyData.updated ||
          ""

      });

    }


    if (
      timlonData &&
      getEmployeeNameFromData(timlonData)
        === normalized
    ) {

      candidates.push({

        type: "Timlön",

        data: timlonData,

        updated:
          timlonData.updated ||
          timlonData.date ||
          ""

      });

    }


    if (kollektivData) {

      candidates.push({

        type: "Kollektivavtal",

        data: kollektivData,

        updated:
          kollektivData.updated ||
          kollektivData.date ||
          ""

      });

    }


    if (candidates.length === 0) {

      return null;

    }


    candidates.sort(
      function(a, b) {

        return String(b.updated)
          .localeCompare(
            String(a.updated)
          );

      }
    );


    return {

      type:
        candidates[0].type,

      periodStart:
        candidates[0].data.periodStart ||
        "",

      periodEnd:
        candidates[0].data.periodEnd ||
        "",

      savedAt:
        candidates[0].updated ||
        ""

    };

  }


  function getSalaryDataForEmployee(employeeName) {

    const active =
      getActiveSalaryRecord(
        employeeName
      );


    if (!active) {

      return null;

    }


    const type =
      active.type;


    const normalized =
      normalizeName(employeeName);


    if (type === "Timlön") {

      const data =
        JSON.parse(
          localStorage.getItem(
            "genieTimlonData"
          )
        ) || null;


      if (
        data &&
        getEmployeeNameFromData(data)
          === normalized
      ) {

        return {

          type: "Timlön",

          data: data

        };

      }

    }


    if (type === "Månadslön") {

      const data =
        JSON.parse(
          localStorage.getItem(
            "genieManadslonData"
          )
        ) || null;


      if (
        data &&
        getEmployeeNameFromData(data)
          === normalized
      ) {

        return {

          type: "Månadslön",

          data: data

        };

      }

    }


    if (type === "Kollektivavtal") {

      const list =
        JSON.parse(
          localStorage.getItem(
            "employerSalaryList"
          )
        ) || [];


      const matches =
        list.filter(function(item) {

          return (
            getEmployeeNameFromData(item)
              === normalized
          );

        });


      if (matches.length > 0) {

        return {

          type: "Kollektivavtal",

          data:
            matches[matches.length - 1]

        };

      }

    }


    return null;

  }


  // ==========================================
  // FÖRETAGSINFO
  // ==========================================

  function loadCompanyInfo() {

    const saved =
      JSON.parse(
        localStorage.getItem(
          "genieCompanyInfo"
        )
      ) || {};


    document.getElementById(
      "companyName"
    ).textContent =
      saved.name || "";


    document.getElementById(
      "companyInfo"
    ).textContent =
      saved.info || "";

  }


  function loadSavedEmployerLogo() {

    const logo =
      localStorage.getItem(
        "genieEmployerLogo"
      );


    const image =
      document.getElementById(
        "companyLogo"
      );


    if (logo) {

      image.src =
        logo;

      image.style.display =
        "block";

    }

  }


  // ==========================================
  // ANSTÄLLDA
  // ==========================================

  function saveEmployees() {

    localStorage.setItem(

      "genieEmployees",

      JSON.stringify(
        employees
      )

    );

  }


  function addEmployee() {

    const name =
      prompt(
        "Ange arbetstagarens namn:"
      );


    if (
      !name ||
      name.trim() === ""
    ) {

      return;

    }


    const cleanName =
      name.trim();


    employees.push({

      name:
        cleanName,

      created:
        new Date().toISOString()

    });


    saveEmployees();

    updateEmployeeList();

  }


  function updateEmployeeList() {

    const list =
      document.getElementById(
        "employeeList"
      );


    const count =
      document.getElementById(
        "employeeCount"
      );


    list.innerHTML =
      "";


    count.textContent =
      employees.length === 0

        ? "Inga anställda registrerade"

        : employees.length +
          " anställd" +
          (
            employees.length === 1
              ? ""
              : "a"
          );


    if (employees.length === 0) {

      list.innerHTML =

        '<div class="empty">' +
        'Lägg till en anställd för att börja.' +
        '</div>';

      return;

    }


    const messages =
      JSON.parse(
        localStorage.getItem(
          "genieMessages"
        )
      ) || [];


    employees.forEach(
      function(employee, index) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "employee-card";


        const name =
          employee.name || "Okänd anställd";


        card.innerHTML =

          '<div class="employee-name">' +
          escapeHtml(name) +
          '</div>' +

          '<div class="employee-actions">' +

          '<button class="view-button" ' +
          'onclick="viewEmployee(' +
          index +
          ')">' +
          '👁 Visa uppgifter' +
          '</button>' +

          '<button class="contact-button" ' +
          'onclick="contactEmployee(' +
          index +
          ')">' +
          '💬 Kontakta anställd' +
          '</button>' +

          '</div>';


        const normalized =
          normalizeName(name);


        const employeeMessages =
          messages.filter(
            function(item) {

              return (
                normalizeName(
                  item.employee
                )
                ===
                normalized
              );

            }
          );


        if (
          employeeMessages.length > 0
        ) {

          const latest =
            employeeMessages[
              employeeMessages.length - 1
            ];


          const status =
            latest.status ||
            "Ny kommentar";


          const statusClass =
            status === "Åtgärdad"
              ? "status-fixed"
              : "status-new";


          const messageBox =
            document.createElement(
              "div"
            );


          messageBox.className =
            "message-status";


          messageBox.innerHTML =

            "<strong>💬 Senaste meddelande:</strong><br>" +

            escapeHtml(
              latest.message || ""
            ) +

            "<br><span class='" +
            statusClass +
            "'>Status: " +
            escapeHtml(
              status
            ) +
            "</span>";


          card.appendChild(
            messageBox
          );

        }


        list.appendChild(
          card
        );

      }
    );

  }


  // ==========================================
  // VISA ANSTÄLLD
  // ==========================================

  function viewEmployee(index) {

    selectedEmployeeIndex =
      index;


    const employee =
      employees[index];


    if (!employee) {

      return;

    }


    const detailsCard =
      document.getElementById(
        "detailsCard"
      );


    const detailsTitle =
      document.getElementById(
        "detailsTitle"
      );


    const payType =
      document.getElementById(
        "payType"
      );


    const detailsContent =
      document.getElementById(
        "detailsContent"
      );


    detailsTitle.textContent =
      employee.name;


    const salary =
      getSalaryDataForEmployee(
        employee.name
      );


    detailsContent.innerHTML =
      "";


    if (!salary) {

      payType.textContent =
        "Ingen löneuppgift registrerad";


      detailsContent.innerHTML =

        '<div class="empty">' +
        'Det finns ännu inga sparade löneuppgifter för denna anställd.' +
        '</div>';

    }

    else {

      payType.textContent =
        salary.type;


      renderSalaryDetails(
        salary.type,
        salary.data,
        detailsContent
      );

    }


    loadEmployeeMessages(
      employee.name
    );


    detailsCard.style.display =
      "block";


    detailsCard.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }


  // ==========================================
  // VISA LÖNEUPPGIFTER
  // ==========================================

  function renderSalaryDetails(
    type,
    data,
    container
  ) {

    if (type === "Timlön") {

      renderTimlon(
        data,
        container
      );

      return;

    }


    if (type === "Kollektivavtal") {

      renderKollektivavtal(
        data,
        container
      );

      return;

    }


    if (type === "Månadslön") {

      renderManadslon(
        data,
        container
      );

      return;

    }

  }


  function addInfoRow(
    container,
    label,
    value
  ) {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "info-row";


    row.innerHTML =

      '<span class="info-label">' +
      escapeHtml(label) +
      '</span>' +

      '<span class="info-value">' +
      escapeHtml(
        value === undefined ||
        value === null ||
        value === ""
          ? "-"
          : String(value)
      ) +
      '</span>';


    container.appendChild(
      row
    );

  }


  function renderTimlon(
    data,
    container
  ) {

    addInfoRow(
      container,
      "Löneperiod",
      formatPeriod(
        data.periodStart,
        data.periodEnd
      )
    );


    addInfoRow(
      container,
      "Vanliga timmar",
      data.regularHours
    );


    addInfoRow(
      container,
      "Övertid",
      data.regularOvertimeHours
    );


    addInfoRow(
      container,
      "Natt",
      data.nightHours
    );


    addInfoRow(
      container,
      "Nattövertid",
      data.nightOvertimeHours
    );


    addInfoRow(
      container,
      "Helg",
      data.weekendHours
    );


    addInfoRow(
      container,
      "Helgövertid",
      data.weekendOvertimeHours
    );


    addInfoRow(
      container,
      "Helgdag",
      data.holidayHours
    );


    addInfoRow(
      container,
      "Helgdagsövertid",
      data.holidayOvertimeHours
    );


    addInfoRow(
      container,
      "Semesterersättning",
      data.vacationPay !== undefined
        ? data.vacationPay + " %"
        : "-"
    );


    addInfoRow(
      container,
      "Bruttolön",
      data.grossSalary !== undefined
        ? data.grossSalary + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Skatt",
      data.taxAmount !== undefined
        ? data.taxAmount + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Nettolön",
      data.netSalary !== undefined
        ? data.netSalary + " kr"
        : "-"
    );

  }


  function renderKollektivavtal(
    data,
    container
  ) {

    addInfoRow(
      container,
      "Löneperiod",
      formatPeriod(
        data.periodStart,
        data.periodEnd
      )
    );


    addInfoRow(
      container,
      "Vanliga timmar",
      data.regularHours
    );


    addInfoRow(
      container,
      "Vanlig lön",
      data.regularPay !== undefined
        ? data.regularPay + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Övertid",
      data.regularOvertimeHours
    );


    addInfoRow(
      container,
      "Övertidslön",
      data.regularOvertimePay !== undefined
        ? data.regularOvertimePay + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Helg",
      data.weekendHours
    );


    addInfoRow(
      container,
      "Helglön",
      data.weekendPay !== undefined
        ? data.weekendPay + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Helgövertid",
      data.weekendOvertimeHours
    );


    addInfoRow(
      container,
      "Helgövertidslön",
      data.weekendOvertimePay !== undefined
        ? data.weekendOvertimePay + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Helgdag",
      data.holidayHours
    );


    addInfoRow(
      container,
      "Helgdagslön",
      data.holidayPayAmount !== undefined
        ? data.holidayPayAmount + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Helgdagsövertid",
      data.holidayOvertimeHours
    );


    addInfoRow(
      container,
      "Helgdagsövertidslön",
      data.holidayOvertimePay !== undefined
        ? data.holidayOvertimePay + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Semesterersättning",
      data.vacationPay !== undefined
        ? data.vacationPay + " %"
        : "-"
    );


    addInfoRow(
      container,
      "Bruttolön",
      data.grossSalary !== undefined
        ? data.grossSalary + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Skatt",
      data.taxAmount !== undefined
        ? data.taxAmount + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Nettolön",
      data.netSalary !== undefined
        ? data.netSalary + " kr"
        : "-"
    );

  }


  function renderManadslon(
    data,
    container
  ) {

    addInfoRow(
      container,
      "Löneperiod",
      formatPeriod(
        data.periodStart,
        data.periodEnd
      )
    );


    addInfoRow(
      container,
      "Månadslön",
      data.monthlySalary !== undefined
        ? data.monthlySalary + " kr"
        : "-"
    );


    addInfoRow(
      container,
      "Arbetstidsmål",
      data.workTarget !== undefined
        ? data.workTarget + " timmar"
        : "-"
    );


    addInfoRow(
      container,
      "Totalt arbetad tid",
      data.totalHours
    );


    addInfoRow(
      container,
      "Måltid",
      data.targetHours
    );


    addInfoRow(
      container,
      "Skillnad",
      data.difference
    );

  }


  // ==========================================
  // PERIOD
  // ==========================================

  function formatPeriod(
    start,
    end
  ) {

    if (!start && !end) {

      return "-";

    }


    if (start && end) {

      return start +
        " – " +
        end;

    }


    return start || end;

  }


  // ==========================================
  // KOMMUNIKATION
  // ==========================================

  function contactEmployee(index) {

    const employee =
      employees[index];


    if (!employee) {

      return;

    }


    const salary =
      getSalaryDataForEmployee(
        employee.name
      );


    const message =
      prompt(
        "Skriv ett meddelande till " +
        employee.name +
        ":"
      );


    if (
      !message ||
      message.trim() === ""
    ) {

      return;

    }


    const messages =
      JSON.parse(
        localStorage.getItem(
          "genieMessages"
        )
      ) || [];


    const now =
      new Date();


    const activeType =
      salary
        ? salary.type
        : "";


    const periodStart =
      salary &&
      salary.data
        ? salary.data.periodStart || ""
        : "";


    const periodEnd =
      salary &&
      salary.data
        ? salary.data.periodEnd || ""
        : "";


    messages.push({

      employee:
        employee.name,

      type:
        "Arbetsgivare",

      payType:
        activeType,

      message:
        message.trim(),

      date:
        now.toLocaleDateString(
          "sv-SE"
        ),

      time:
        now.toLocaleTimeString(
          "sv-SE",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        ),

      status:
        "Ny kommentar",

      reply:
        "",

      replyDate:
        "",

      replyTime:
        "",

      periodStart:
        periodStart,

      periodEnd:
        periodEnd,

      periodKey:
        periodStart +
        "_" +
        periodEnd

    });


    localStorage.setItem(

      "genieMessages",

      JSON.stringify(
        messages
      )

    );


    alert(
      "Meddelandet har skickats till " +
      employee.name + "."
    );


    updateEmployeeList();


    if (
      selectedEmployeeIndex === index
    ) {

      loadEmployeeMessages(
        employee.name
      );

    }

  }


  function loadEmployeeMessages(
    employeeName
  ) {

    const container =
      document.getElementById(
        "employeeMessages"
      );


    container.innerHTML =
      "";


    const messages =
      JSON.parse(
        localStorage.getItem(
          "genieMessages"
        )
      ) || [];


    const normalized =
      normalizeName(
        employeeName
      );


    const employeeMessages =
      messages.filter(
        function(item) {

          return (
            normalizeName(
              item.employee
            )
            ===
            normalized
          );

        }
      );


    if (
      employeeMessages.length === 0
    ) {

      container.innerHTML =

        '<div class="empty">' +
        'Inga meddelanden ännu.' +
        '</div>';

      return;

    }


    employeeMessages.forEach(
      function(item) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "message-card";


        const status =
          item.status ||
          "Ny kommentar";


        const statusClass =
          status === "Åtgärdad"
            ? "status-fixed"
            : "status-new";


        let html =

          "<strong>📤 Meddelande från arbetsgivaren</strong>" +

          "<div class='message-text'>" +
          escapeHtml(
            item.message || ""
          ) +
          "</div>" +

          "<div style='font-size:13px;color:#6b7280;'>" +
          escapeHtml(
            item.date || ""
          ) +
          " " +
          escapeHtml(
            item.time || ""
          ) +
          "</div>" +

          "<div style='margin-top:8px;'>" +
          "<strong>Status:</strong> " +

          "<span class='" +
          statusClass +
          "'>" +
          escapeHtml(
            status
          ) +
          "</span>" +

          "</div>";


        if (
          item.reply &&
          String(
            item.reply
          ).trim() !== ""
        ) {

          html +=

            "<div class='reply-text'>" +

            "<strong>↩️ Svar från arbetstagaren</strong>" +

            "<div style='margin-top:5px;'>" +
            escapeHtml(
              item.reply
            ) +
            "</div>" +

            "<div style='font-size:13px;color:#6b7280;margin-top:5px;'>" +
            escapeHtml(
              item.replyDate || ""
            ) +
            " " +
            escapeHtml(
              item.replyTime || ""
            ) +
            "</div>" +

            "</div>";

        }


        card.innerHTML =
          html;


        container.appendChild(
          card
        );

      }
    );

  }


  // ==========================================
  // STÄNG DETALJER
  // ==========================================

  function closeEmployee() {

    document.getElementById(
      "detailsCard"
    ).style.display =
      "none";


    selectedEmployeeIndex =
      null;

  }


  // ==========================================
  // SKYDDA HTML
  // ==========================================

  function escapeHtml(value) {

    return String(value || "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==========================================
  // START
  // ==========================================

  loadCompanyInfo();

  loadSavedEmployerLogo();

  updateEmployeeList();

</script>
