<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Genie – Arbetsgivare</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #1f2937;
    }

    .container {
      max-width: 640px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .language-box {
      text-align: right;
      margin-bottom: 18px;
    }

    .language-box select {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      font-size: 14px;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #111827;
    }

    .subtitle {
      margin-top: 7px;
      color: #6b7280;
      font-size: 15px;
    }

    /* ==========================================
       FÖRETAGSINFORMATION
    ========================================== */

    .company-card {
      margin-bottom: 22px;
      padding: 18px;
      border-radius: 17px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      text-align: center;
    }

    .company-logo-box {
      width: 100%;
      min-height: 130px;
      border: 2px dashed #d1d5db;
      border-radius: 15px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      overflow: hidden;
      padding: 10px;
    }

    .company-logo-placeholder {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.5;
    }

    .company-logo {
      display: none;
      max-width: 220px;
      max-height: 120px;
      border-radius: 12px;
      object-fit: contain;
    }

    .company-input {
      width: 100%;
      margin-top: 10px;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      background: #ffffff;
      color: #111827;
      font-size: 15px;
      font-family: inherit;
    }

    .company-textarea {
      width: 100%;
      min-height: 100px;
      margin-top: 10px;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      background: #ffffff;
      color: #111827;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
    }

    .company-input:focus,
    .company-textarea:focus {
      outline: none;
      border-color: #6b7280;
      background: #ffffff;
    }

    .logo-input {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #ffffff;
      font-size: 14px;
    }

    .save-company-button {
      margin-top: 12px;
      background: #1f2937;
      color: #ffffff;
    }

    .company-display {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }

    .company-name {
      font-size: 19px;
      font-weight: 700;
      color: #111827;
      white-space: pre-wrap;
    }

    .company-info {
      margin-top: 7px;
      color: #6b7280;
      font-size: 14px;
      white-space: pre-wrap;
    }

    /* ==========================================
       SEKTIONER
    ========================================== */

    .section-title {
      font-size: 19px;
      font-weight: 700;
      color: #111827;
      text-align: center;
      margin: 22px 0 12px;
    }

    .employee-count {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .employee-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .employee-name {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
      white-space: pre-wrap;
    }

    .employee-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .view-button {
      background: #1f2937;
      color: #ffffff;
    }

    .contact-button {
      background: #e5e7eb;
      color: #111827;
    }

    .add-button {
      margin-top: 8px;
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .back-button {
      margin-top: 20px;
      background: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    /* ==========================================
       MEDDELANDEN
    ========================================== */

    .message-status {
      margin-top: 10px;
      padding: 9px;
      border-radius: 9px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      font-size: 13px;
      color: #6b7280;
      white-space: pre-wrap;
    }

    .message-card {
      margin-top: 12px;
      padding: 13px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
    }

    .message-text {
      white-space: pre-wrap;
      margin: 8px 0;
    }

    .reply-text {
      white-space: pre-wrap;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
    }

    .status-fixed {
      color: #166534;
      font-weight: 700;
    }

    .status-new {
      color: #92400e;
      font-weight: 700;
    }

    /* ==========================================
       DETALJER
    ========================================== */

    .details-card {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 17px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .details-title {
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 18px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #6b7280;
    }

    .info-value {
      color: #111827;
      font-weight: 700;
      text-align: right;
      white-space: pre-wrap;
    }

    .pay-type {
      margin: 0 auto 16px;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 20px;
      background: #1f2937;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .salary-section {
      margin-top: 18px;
      padding-top: 8px;
    }

    .salary-section-title {
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111827;
    }

    .close-button {
      margin-top: 18px;
      background: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 15px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

         DETALJER
    ======================================= -->

      </div>


      <div

      </div>


      <div

      </div>


      <div class="salary-section">

        </div>


        <div

      </div>


      <button
        type="button"
        class="close-button"
        onclick="closeEmployee()"

        ← Stäng

    </div>


    <!-- ======================================
         TILLBAKA
    ======================================= -->

    <button
      type="button"
      class="back-button"
      onclick="window.location.href='index.html'"

      ← Tillbaka

    </button>


    <div
      class="footer"
      id="footer">

      Genie – Enkel och transparent löneberäkning

  </div>

</div>

  };


  /* ==========================================
     GEMENSAM DATA
  ========================================== */

  const GENIE_SALARY_DATA_KEY =
    "genieSalaryData";

  const GENIE_MESSAGES_KEY =
    "genieMessages";

  const GENIE_LANGUAGE_KEY =
    "genieLanguage";


  let currentLanguage =
    localStorage.getItem(
      GENIE_LANGUAGE_KEY
    ) || "sv";


  let employees =
    JSON.parse(
      localStorage.getItem(
        "genieEmployees"
      )
    ) || [];


  let selectedEmployeeIndex =
    null;


  /* ==========================================
     HJÄLPFUNKTIONER
  ========================================== */

  function t(key) {

    return (
      translations[currentLanguage] &&
      translations[currentLanguage][key]
    )
    ||
    translations.sv[key]
    ||
    key;

  }


  function normalizeName(name) {

    return String(
      name || ""
    )
      .trim()
      .replace(/\s+/g, " ")
      .toLowerCase();

  }


  function readSalaryData() {

    try {

      return JSON.parse(
        localStorage.getItem(
          GENIE_SALARY_DATA_KEY
        )
      ) || {};

    }

    catch (error) {

      return {};

    }

  }


  function getPeriodKey(data) {

    const start =
      data &&
      data.periodStart
        ? data.periodStart
        : "";

    const end =
      data &&
      data.periodEnd
        ? data.periodEnd
        : "";

    return (
      start +
      "_" +
      end
    );

  }


  function getLatestRecordFromType(
    typeData
  ) {

    if (
      !typeData ||
      typeof typeData !== "object"
    ) {

      return null;

    }


    const periods =
      Object.keys(
        typeData
      );


    if (
      periods.length === 0
    ) {

      return null;

    }


    const records =
      periods
        .map(
          function(periodKey) {

            return typeData[
              periodKey
            ];

          }
        )
        .filter(
          function(record) {

            return (
              record &&
              typeof record === "object"
            );

          }
        );


    if (
      records.length === 0
    ) {

      return null;

    }


    records.sort(
      function(a, b) {

        return String(
          b.updated || ""
        )
          .localeCompare(
            String(
              a.updated || ""
            )
          );

      }
    );


    return records[0];

  }


  /* ==========================================
     AKTIV LÖNETYP
  ========================================== */

  function getActiveSalaryRecord(
    employeeName
  ) {

    const employeeKey =
      normalizeName(
        employeeName
      );


    const salaryData =
      readSalaryData();


    const employeeData =
      salaryData[
        employeeKey
      ];


    if (
      !employeeData ||
      !employeeData.types
    ) {

      return null;

    }


    const types =
      employeeData.types;


    /* --------------------------------------
       1. Försök använda aktuell typ
    -------------------------------------- */

    const currentEmployeeKey =
      localStorage.getItem(
        "genieCurrentEmployeeKey"
      );


    const currentSalaryType =
      localStorage.getItem(
        "genieCurrentSalaryType"
      );


    const currentPeriodKey =
      localStorage.getItem(
        "genieCurrentPeriodKey"
      );


    if (
      currentEmployeeKey === employeeKey &&
      currentSalaryType &&
      types[currentSalaryType]
    ) {

      const currentTypeData =
        types[
          currentSalaryType
        ];


      if (
        currentPeriodKey &&
        currentTypeData[
          currentPeriodKey
        ]
      ) {

        return {

          type:
            currentSalaryType,

          data:
            currentTypeData[
              currentPeriodKey
            ]

        };

      }


      const latestCurrent =
        getLatestRecordFromType(
          currentTypeData
        );


      if (latestCurrent) {

        return {

          type:
            currentSalaryType,

          data:
            latestCurrent

        };

      }

    }


    /* --------------------------------------
       2. Om ingen aktiv pekare finns:
          använd senast uppdaterade posten
    -------------------------------------- */

    const candidates = [];


    Object.keys(
      types
    )
      .forEach(
        function(type) {

          const record =
            getLatestRecordFromType(
              types[type]
            );


          if (record) {

            candidates.push({

              type:
                type,

              data:
                record,

              updated:
                record.updated ||
                ""

            });

          }

        }
      );


    if (
      candidates.length === 0
    ) {

      return null;

    }


    candidates.sort(
      function(a, b) {

        return String(
          b.updated
        )
          .localeCompare(
            String(
              a.updated
            )
          );

      }
    );


    return {

      type:
        candidates[0].type,

      data:
        candidates[0].data

    };

  }

  /* ==========================================
     PERIOD
  ========================================== */

  function formatPeriod(
    start,
    end
  ) {

    if (
      !start &&
      !end
    ) {

      return "-";

    }


    if (
      start &&
      end
    ) {

      return start +
        " – " +
        end;

    }


    return start ||
      end;

  }

  function contactEmployee(index) {

    const employee =
      employees[index];


    if (!employee) {

      return;

    }


    const salary =
      getSalaryDataForEmployee(
        employee.name
      );


    const message =
      prompt(
        t("messagePrompt") +
        employee.name +
        ":"
      );


    if (
      !message ||
      message.trim() === ""
    ) {

      return;

    }


    const messages =
      JSON.parse(
        localStorage.getItem(
          GENIE_MESSAGES_KEY
        )
      ) || [];


    const now =
      new Date();


    const activeType =
      salary
        ? salary.type
        : "";


    const periodStart =
      salary &&
      salary.data
        ? salary.data.periodStart || ""
        : "";


    const periodEnd =
      salary &&
      salary.data
        ? salary.data.periodEnd || ""
        : "";


    messages.push({

      employee:
        employee.name,

      type:
        "Arbetsgivare",

      payType:
        activeType,

      message:
        message.trim(),

      date:
        now.toLocaleDateString(
          "sv-SE"
        ),

      time:
        now.toLocaleTimeString(
          "sv-SE",
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        ),

      status:
        "Ny kommentar",

      reply:
        "",

      replyDate:
        "",

      replyTime:
        "",

      periodStart:
        periodStart,

      periodEnd:
        periodEnd,

      periodKey:
        periodStart +
        "_" +
        periodEnd

    });


    localStorage.setItem(
      GENIE_MESSAGES_KEY,
      JSON.stringify(
        messages
      )
    );


    alert(
      t("messageSent") +
      employee.name +
      "."
    );


    updateEmployeeList();


    if (
      selectedEmployeeIndex === index
    ) {

      loadEmployeeMessages(
        employee.name
      );

    }

  }


  function loadEmployeeMessages(
  employeeName
) {

  const container =
    document.getElementById(
      "employeeMessages"
    );

  container.innerHTML =
    "";

  const messages =
    JSON.parse(
      localStorage.getItem(
        GENIE_MESSAGES_KEY
      )
    ) || [];

  const normalized =
    normalizeName(
      employeeName
    );

  const salary =
    getSalaryDataForEmployee(
      employeeName
    );

  /*
    Visa endast meddelanden som hör till
    den aktuella löneuppgiften:
    1. rätt anställd
    2. rätt lönetyp
    3. rätt löneperiod
  */

  const activeType =
    salary
      ? salary.type
      : "";

  const activePeriodStart =
    salary &&
    salary.data
      ? salary.data.periodStart || ""
      : "";

  const activePeriodEnd =
    salary &&
    salary.data
      ? salary.data.periodEnd || ""
      : "";

  const activePeriodKey =
    activePeriodStart +
    "_" +
    activePeriodEnd;


  const employeeMessages =
    messages.filter(
      function(item) {

        if (
          normalizeName(
            item.employee
          )
          !==
          normalized
        ) {

          return false;

        }


        /*
          Arbetsgivarens meddelande måste
          höra till den aktuella lönetypen.
        */

        if (
          item.payType &&
          activeType &&
          item.payType !== activeType
        ) {

          return false;

        }


        /*
          Om meddelandet har en period
          måste perioden vara samma.
        */

        if (
          item.periodKey &&
          activePeriodKey &&
          item.periodKey !== activePeriodKey
        ) {

          return false;

        }


        /*
          Äldre meddelanden utan period
          eller lönetyp tillåts fortfarande
          för att inte förlora gamla meddelanden.
        */

        return true;

      }
    );


  if (
    employeeMessages.length === 0
  ) {

    container.innerHTML =

      '<div class="empty">' +
      escapeHtml(
        t("noMessages")
      ) +
      '</div>';

    return;

  }


  employeeMessages.forEach(
    function(item) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "message-card";


      const status =
        item.status ||
        "Ny kommentar";


      const statusClass =
        status === "Åtgärdad"
          ? "status-fixed"
          : "status-new";


      let html =

        "<strong>" +
        escapeHtml(
          t("employerMessage")
        ) +
        "</strong>" +

        "<div class='message-text'>" +
        escapeHtml(
          item.message || ""
        ) +
        "</div>" +

        "<div style='font-size:13px;color:#6b7280;'>" +
        escapeHtml(
          item.date || ""
        ) +
        " " +
        escapeHtml(
          item.time || ""
        ) +
        "</div>" +

        "<div style='margin-top:8px;'>" +

        "<strong>" +
        escapeHtml(
          t("status")
        ) +
        ":</strong> " +

        "<span class='" +
        statusClass +
        "'>" +

        escapeHtml(
          translateStatus(
            status
          )
        ) +

        "</span>" +

        "</div>";


      if (
        item.reply &&
        String(
          item.reply
        ).trim() !== ""
      ) {

        html +=

          "<div class='reply-text'>" +

          "<strong>" +
          escapeHtml(
            t("employeeReply")
          ) +
          "</strong>" +

          "<div style='margin-top:5px;'>" +
          escapeHtml(
            item.reply
          ) +
          "</div>" +

          "<div style='font-size:13px;color:#6b7280;margin-top:5px;'>" +

          escapeHtml(
            item.replyDate || ""
          ) +

          " " +

          escapeHtml(
            item.replyTime || ""
          ) +

          "</div>" +

          "</div>";

      }


      card.innerHTML =
        html;


      container.appendChild(
        card
      );

    }
  );

}


  /* ==========================================
     STÄNG
  ========================================== */

  function closeEmployee() {

    document.getElementById(
      "detailsCard"
    ).style.display =
      "none";


    selectedEmployeeIndex =
      null;

  }


  /* ==========================================
     SKYDDA HTML
  ========================================== */

  function escapeHtml(value) {

    return String(
      value || ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* ==========================================
     START
  ========================================== */

  loadCompanyInfo();

  loadSavedEmployerLogo();

  updateEmployeeList();

  applyLanguage();

</script>
</body>
</html>
